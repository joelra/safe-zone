org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Base Fabric Loom version; loom-back-compat derives the correct variant per MC version.
loomx.loom_version=1.17-SNAPSHOT

# Mod coordinates (shared across all versions).
mod.id=safe-zone
mod.name=Safe Zone
mod.group=com.simpleforapanda.safezone
mod.version=1.5.0

# Shared dependency versions (single source of truth for all branches).
deps.gson=2.13.2
deps.slf4j=2.0.17
deps.junit_bom=5.12.2

# Per-version values live in versions/<mc>/gradle.properties.
# [versioned] marks a key that must be overridden per Minecraft version.
java.version=[versioned]
minecraft.dependency=[versioned]
fabric.loader.version=[versioned]
fabric.api.version=[versioned]
paper.api.version=[versioned]
paper.api_level=[versioned]
axiom.version_id=[versioned]
