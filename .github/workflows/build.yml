name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDKs
        # Java 21 for 1.21.11, Java 25 for 26.1+. Installing both lets the Gradle
        # toolchain pick the right one per Minecraft version without downloading.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify sources were committed with the VCS version active
        # Stonecutter rewrites shared sources when switching versions; commits must
        # be made with the vcsVersion (26.2) active. Resetting must be a no-op.
        run: |
          ./gradlew "Reset active project" --no-daemon
          git diff --exit-code

      - name: Build all versions
        # Root `build` aggregates every Stonecutter node (common/fabric/paper x
        # 1.21.11 / 26.1.2 / 26.2).
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: safe-zone-build-${{ github.run_number }}
          path: |
            fabric/versions/*/build/libs/*.jar
            !fabric/versions/*/build/libs/*-sources.jar
            paper/versions/*/build/libs/*.jar
            !paper/versions/*/build/libs/*-sources.jar
          if-no-files-found: error
